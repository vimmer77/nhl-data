name: daily-build
on:
  schedule:
    # Every 2 hours, 1:17am-11:17am Pacific standard time (08:17-18:17 UTC). GitHub often starts
    # scheduled runs hours late, so several runs make it likely a fresh build lands before noon.
    # Later runs also pick up roster and injury changes during the day.
    - cron: "17 8,10,12,14,16,18 * * *"
  workflow_dispatch:
    inputs:
      build_date:
        description: "Test mode: pretend today is YYYY-MM-DD (writes to test/ instead of data/ and output/)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: daily-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_DATE: ${{ inputs.build_date }}
      DATA_DIR: ${{ inputs.build_date != '' && 'test/data' || 'data' }}
      OUT_DIR: ${{ inputs.build_date != '' && 'test/output' || 'output' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --quiet pandas openpyxl
      - name: Build
        run: |
          set -o pipefail
          mkdir -p "$OUT_DIR"
          python scripts/build.py 2>&1 | tee "$OUT_DIR/run_log.txt"
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in data output test; do if [ -e "$p" ]; then git add -A "$p"; fi; done
          git diff --cached --quiet && exit 0
          git commit -m "Daily data build ${BUILD_DATE:-$(date -u +%F)}"
          git pull --rebase --quiet && git push
